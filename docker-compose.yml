services:
  postgres:
    image: postgres:16-alpine
    container_name: meet-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meetflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetflow}
      POSTGRES_DB: ${POSTGRES_DB:-meetflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - meet-flow-postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  meet-flow-postgres-data:
    name: meet-flow-postgres-data
